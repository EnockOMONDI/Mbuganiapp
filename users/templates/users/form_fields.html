{% if form.non_field_errors %}<div role="alert" class="form-errors">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}{% if field.is_hidden %}{{ field }}{% else %}<div class="quality-field field-{{ field.name }}{% if field.field.widget.input_type == 'checkbox' %} check-field{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required and field.name != 'start_date' and field.name != 'flexible_dates' %} <span class="optional">(optional)</span>{% endif %}</label>{{ field }}{% if field.help_text %}<div class="field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}{% if field.errors %}<div class="form-errors" role="alert">{{ field.errors }}</div>{% endif %}</div>{% endif %}{% endfor %}
